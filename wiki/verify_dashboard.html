<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>수학 문제 3단계 검수 시스템</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--c1:#1565c0;--c2:#2e7d32;--c3:#6a1b9a;--cr:#c62828;--cy:#e65100}
body{font-family:'Malgun Gothic',sans-serif;background:#f0f2f5;font-size:14px}
.hd{background:var(--c1);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:200;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.hd h1{font-size:1rem;white-space:nowrap}
.hstats{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.hs{padding:3px 9px;border-radius:12px;font-size:.72rem;cursor:pointer;background:rgba(255,255,255,.18)}
.hs:hover{background:rgba(255,255,255,.3)}
/* 필터 패널 */
.filters{background:#fff;border-bottom:2px solid #e0e0e0;padding:10px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;position:sticky;top:44px;z-index:199}
.filter-group{display:flex;align-items:center;gap:4px}
.fl{font-size:.72rem;color:#888;white-space:nowrap}
.fsel{padding:4px 8px;border:1px solid #ddd;border-radius:6px;font-size:.78rem;cursor:pointer;background:#f8f8f8}
.fsel:focus{outline:none;border-color:var(--c1)}
.fsearch{padding:5px 10px;border:1px solid #ddd;border-radius:6px;font-size:.8rem;width:160px}
.fsearch:focus{outline:none;border-color:var(--c1)}
.fcnt{font-size:.78rem;color:#666;margin-left:auto}
/* 단계탭 */
.stabs{background:#fff;border-bottom:1px solid #e0e0e0;display:flex;padding:0 16px;overflow-x:auto}
.stab{padding:7px 14px;cursor:pointer;font-size:.82rem;font-weight:600;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap;color:#888}
.stab.on{color:var(--c1);border-color:var(--c1)}
/* 진행바 */
.pbars{background:#fff;padding:5px 16px 7px;border-bottom:1px solid #e0e0e0}
.prow{display:flex;align-items:center;gap:6px;font-size:.72rem;color:#666;margin-bottom:2px}
.pbar{flex:1;height:4px;background:#e0e0e0;border-radius:2px;overflow:hidden}
.pfill{height:100%;border-radius:2px;transition:width .4s}
.pf1{background:var(--c1)}.pf2{background:var(--c2)}.pf3{background:var(--c3)}
.pfa{background:#4caf50}.pftr{background:#ff7043}.pfcp{background:#7b1fa2}
/* 그리드 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(460px,1fr));gap:10px;padding:12px 16px}
/* 카드 */
.card{background:#fff;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.1);overflow:hidden;border-left:4px solid #ccc}
.card[data-g="A"]{border-left-color:#4caf50}
.card[data-g="B"]{border-left-color:#ff9800}
.card[data-g="C"]{border-left-color:#f44336}
.card[data-signed="1"]{box-shadow:0 0 0 2px #ce93d8,0 1px 4px rgba(0,0,0,.1)}
/* 카드 헤더 */
.ch{padding:6px 10px;display:flex;align-items:center;gap:6px;background:#fafafa;border-bottom:1px solid #eee;flex-wrap:wrap}
.cnum{font-weight:700;font-size:.9rem;min-width:28px}
.ctitle{font-size:.78rem;color:#444;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:.65rem;padding:1px 6px;border-radius:8px;font-weight:700;border:1px solid}
.tag-year{background:#e3f2fd;color:#1565c0;border-color:#90caf9}
.tag-src{background:#f3e5f5;color:#7b1fa2;border-color:#ce93d8}
.tag-subj{background:#fff3e0;color:#e65100;border-color:#ffcc80}
.tag-mon{background:#e8f5e9;color:#2e7d32;border-color:#a5d6a7}
.gbadge{font-size:.65rem;padding:1px 6px;border-radius:8px;font-weight:700;margin-left:auto}
.gbadge.A{background:#e8f5e9;color:#2e7d32}
.gbadge.B{background:#fff3e0;color:#e65100}
.gbadge.C{background:#ffebee;color:#c62828}
.gbadge.pending{background:#eceff1;color:#607d8b}
.sbadge{font-size:.65rem;padding:1px 6px;border-radius:8px;font-weight:700;border:1px solid}
.sbadge.tr{background:#fff3e0;color:#e65100;border-color:#ffcc80}
.sbadge.cp{background:#f3e5f5;color:#7b1fa2;border-color:#ce93d8}
.sbadge.ok{background:#e8f5e9;color:#2e7d32;border-color:#a5d6a7}
/* 본문 */
.cbody{display:flex;min-height:160px}
.cimg-w{width:52%;background:#f8f8f8;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:zoom-in;border-right:1px solid #eee;position:relative}
.cimg{max-width:100%;max-height:280px;object-fit:contain;padding:4px}
.cinfo{width:48%;padding:8px 10px;display:flex;flex-direction:column;gap:5px;overflow-y:auto;max-height:280px}
.ci{display:flex;gap:3px;font-size:.76rem}
.cl{color:#888;min-width:40px;flex-shrink:0}
.cv{color:#222;font-weight:600}
.cans{font-size:.95rem;color:var(--c1);font-weight:700}
.strow{display:flex;gap:3px;flex-wrap:wrap}
.stg{font-size:.65rem;padding:1px 5px;border-radius:5px;font-weight:600}
.stg.pass{background:#e8f5e9;color:#2e7d32}
.stg.fail{background:#ffebee;color:#c62828}
.stg.fixed{background:#e3f2fd;color:#1565c0}
.stg.pending{background:#eceff1;color:#90a4ae}
/* 액션 */
.cact{padding:8px 10px;border-top:1px solid #eee;background:#fafafa}
.sec{margin-bottom:6px}
.slbl{font-size:.68rem;font-weight:700;padding:2px 6px;border-radius:3px;display:inline-block;margin-bottom:3px}
.lbl1{background:#e3f2fd;color:#1565c0}.lbl2{background:#e8f5e9;color:#2e7d32}
.lbl3{background:#f3e5f5;color:#7b1fa2}.lbls{background:#fce4ec;color:#c2185b}
.brow{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:3px}
.btn{padding:4px 8px;border-radius:4px;border:none;cursor:pointer;font-size:.72rem;font-weight:600;transition:.1s}
.btn:hover{filter:brightness(.9)}
.bpass{background:#e8f5e9;color:#2e7d32}.bfail{background:#ffebee;color:#c62828}
.bfix{background:#e3f2fd;color:#1565c0}.brst{background:#eceff1;color:#607d8b}
.btn-tr{background:#fff3e0;color:#e65100;border:1px solid #ffcc80}
.btn-tr.signed{background:#e65100;color:#fff}
.btn-cp{background:#f3e5f5;color:#7b1fa2;border:1px solid #ce93d8}
.btn-cp.signed{background:#7b1fa2;color:#fff}
.ta{width:100%;border:1px solid #ddd;border-radius:4px;padding:3px 6px;font-size:.72rem;resize:none;font-family:inherit}
.ta:focus{outline:none;border-color:var(--c1)}
.af{width:100%;border:1px solid var(--cy);border-radius:4px;padding:3px 6px;font-size:.76rem;background:#fffde7;margin-bottom:2px}
.bsave{background:var(--c1);color:#fff;width:100%;padding:5px;border-radius:4px;border:none;cursor:pointer;font-size:.76rem;font-weight:700;margin-top:3px}
.sign-final{background:#fafafa;border:1px solid #e0e0e0;border-radius:6px;padding:6px;margin-top:4px}
/* 라이트박스 */
#lb{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:999;align-items:center;justify-content:center;flex-direction:column}
#lb.show{display:flex}
#lb img{max-width:92vw;max-height:88vh;object-fit:contain;border-radius:6px}
#lb-x{position:fixed;top:12px;right:18px;color:#fff;font-size:1.8rem;cursor:pointer}
.no-r{text-align:center;padding:40px;color:#bbb;grid-column:1/-1}
</style>
</head>
<body>
<div class="hd">
  <h1>📋 수학 문제 3단계 검수 · 서명 시스템</h1>
  <div class="hstats">
    <span class="hs" id="hs-t">전체 0</span>
    <span class="hs" style="background:#e8f5e9;color:#2e7d32" id="hs-a">✅ A 0</span>
    <span class="hs" style="background:#f3e5f5;color:#7b1fa2" id="hs-s">🖊 서명 0</span>
    <span class="hs" style="background:#fff3e0;color:#e65100" id="hs-b">🟠 B 0</span>
    <span class="hs" style="background:#ffebee;color:#c62828" id="hs-c">❌ C 0</span>
    <span class="hs" id="hs-p">⏳ 미완 0</span>
  </div>
</div>

<!-- 필터 패널 -->
<div class="filters">
  <div class="filter-group">
    <span class="fl">연도</span>
    <select class="fsel" id="f-year" onchange="applyFilters()">
      <option value="">전체</option>
      <option value="2025">2025년</option>
      <option value="2026">2026년</option>
    </select>
  </div>
  <div class="filter-group">
    <span class="fl">출처</span>
    <select class="fsel" id="f-src" onchange="applyFilters()">
      <option value="">전체</option>
      <option value="수능">수능</option>
      <option value="모의고사">모의고사</option>
    </select>
  </div>
  <div class="filter-group">
    <span class="fl">월</span>
    <select class="fsel" id="f-mon" onchange="applyFilters()">
      <option value="">전체</option>
      <option value="11월(수능)">11월(수능)</option>
      <option value="10월">10월</option>
    </select>
  </div>
  <div class="filter-group">
    <span class="fl">과목</span>
    <select class="fsel" id="f-subj" onchange="applyFilters()">
      <option value="">전체</option>
      <option value="공통">공통 (1-22번)</option>
      <option value="확통">확률과통계</option>
      <option value="미적분">미적분</option>
      <option value="기하">기하</option>
    </select>
  </div>
  <div class="filter-group">
    <span class="fl">검수</span>
    <select class="fsel" id="f-grade" onchange="applyFilters()">
      <option value="">전체</option>
      <option value="pending">⏳ 미검수</option>
      <option value="A">✅ A등급</option>
      <option value="B">🟠 B등급</option>
      <option value="C">❌ C등급</option>
      <option value="nosign">🖊 서명필요</option>
    </select>
  </div>
  <input class="fsearch" type="text" id="f-search" placeholder="번호·제목·단원 검색..." oninput="applyFilters()">
  <span class="fcnt" id="f-cnt">114개</span>
  <button style="padding:4px 10px;border-radius:6px;border:none;background:#37474f;color:#fff;cursor:pointer;font-size:.75rem;margin-left:4px" onclick="saveAll()">💾 전체저장</button>
  <button style="padding:4px 10px;border-radius:6px;border:none;background:#c2185b;color:#fff;cursor:pointer;font-size:.75rem" onclick="exportRpt()">📄 리포트</button>
  <button style="padding:4px 10px;border-radius:6px;border:none;background:#546e7a;color:#fff;cursor:pointer;font-size:.75rem" onclick="resetFilters()">↺ 초기화</button>
</div>

<!-- 단계탭 -->
<div class="stabs">
  <div class="stab on" id="tab-all" onclick="setTab('all',this)">📋 전체</div>
  <div class="stab" id="tab-s1"  onclick="setTab('s1',this)">1단계 이미지</div>
  <div class="stab" id="tab-s2"  onclick="setTab('s2',this)">2단계 정답</div>
  <div class="stab" id="tab-s3"  onclick="setTab('s3',this)">3단계 해설</div>
  <div class="stab" id="tab-sign" onclick="setTab('sign',this)" style="color:#c2185b">🖊 서명</div>
</div>

<!-- 진행바 -->
<div class="pbars">
  <div class="prow"><span style="min-width:74px">1단계</span><div class="pbar"><div class="pfill pf1" id="p1"></div></div><span id="t1">0%</span></div>
  <div class="prow"><span style="min-width:74px">2단계</span><div class="pbar"><div class="pfill pf2" id="p2"></div></div><span id="t2">0%</span></div>
  <div class="prow"><span style="min-width:74px">3단계</span><div class="pbar"><div class="pfill pf3" id="p3"></div></div><span id="t3">0%</span></div>
  <div class="prow"><span style="min-width:74px">선생님(tr)</span><div class="pbar"><div class="pfill pftr" id="ptr"></div></div><span id="ttr">0%</span></div>
  <div class="prow"><span style="min-width:74px">관리자(cp)</span><div class="pbar"><div class="pfill pfcp" id="pcp"></div></div><span id="tcp">0%</span></div>
  <div class="prow"><span style="min-width:74px;font-weight:700">최종완료</span><div class="pbar"><div class="pfill pfa" id="pa"></div></div><span id="ta" style="font-weight:700;color:#2e7d32">0%</span></div>
</div>

<div class="grid" id="grid"></div>

<div id="lb" onclick="if(event.target===this)cLb()">
  <span id="lb-x" onclick="cLb()">✕</span>
  <img id="lb-img" src="">
</div>

let LS = {};
try{ LS = JSON.parse(localStorage.getItem('mv4')||'{}'); }catch(e){}
const sv = () => localStorage.setItem('mv4', JSON.stringify(LS));
const g = (id,k,fb='') => LS[id]?.[k] ?? fb;
const s = (id,k,v) => { if(!LS[id])LS[id]={}; LS[id][k]=v; sv(); };

let tabF='all', activeFilters={};

const getS1 = p => g(p.id,'s1', p.stage1_img||'pending');
const getS2 = p => g(p.id,'s2', p.stage2_ans||'pending');
const getS3 = p => g(p.id,'s3', p.stage3_sol||'pending');
const getAF = p => g(p.id,'af', p.stage2_answer_fixed||'');
const getSol= p => g(p.id,'sol',p.stage3_solution||'');
const getN  = (p,n) => g(p.id,'n'+n, p['stage'+n+'_note']||'');
const getTrS= (p,n) => g(p.id,'tr'+n, p['sign_tr_s'+n]||'');
const getCpS= (p,n) => g(p.id,'cp'+n, p['sign_cp_s'+n]||'');
const getTrF= p => g(p.id,'trf', p.sign_tr_final||'');
const getCpF= p => g(p.id,'cpf', p.sign_cp_final||'');

function autoGrade(p){
  const s1=getS1(p),s2=getS2(p),s3=getS3(p);
  if(s1==='pass'&&(s2==='pass'||s2==='fixed')&&s3==='pass') return 'A';
  if(s1==='pass'&&(s2==='pass'||s2==='fixed')) return 'B';
  if(s1==='fail'||s2==='fail'||s3==='fail') return 'C';
  return 'pending';
}
const isSigned = p => getTrF(p)!=='' && getCpF(p)!=='';
const ts = () => new Date().toLocaleString('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});

function signStage(p,who,stage){
  const key=who+stage; const cur=g(p.id,key,'');
  s(p.id,key, cur?'': who.toUpperCase()+'✓ '+ts());
  render();
}
function signFinal(p,who){
  const key=who+'f'; const cur=g(p.id,key,'');
  if(cur){ s(p.id,key,''); render(); return; }
  const gr=autoGrade(p);
  if(gr==='pending'||gr==='C'){ alert('3단계 검수를 먼저 완료해주세요.'); return; }
  s(p.id,key, who.toUpperCase()+'✓ '+ts());
  render();
}

function getFiltered(){
  const yr  = document.getElementById('f-year').value;
  const src = document.getElementById('f-src').value;
  const mon = document.getElementById('f-mon').value;
  const subj= document.getElementById('f-subj').value;
  const gr  = document.getElementById('f-grade').value;
  const q   = document.getElementById('f-search').value.toLowerCase();

  return RAW.filter(p => {
    if(yr   && String(p.year)!==yr) return false;
    if(src  && (p.source_type||'')!==src) return false;
    if(mon  && p.month!==mon) return false;
    if(subj && p.subject!==subj) return false;
    const ag=autoGrade(p), sg=isSigned(p);
    if(gr==='A' && ag!=='A') return false;
    if(gr==='B' && ag!=='B') return false;
    if(gr==='C' && ag!=='C') return false;
    if(gr==='pending' && ag!=='pending') return false;
    if(gr==='nosign' && (ag!=='A'||sg)) return false;
    if(tabF==='s1' && getS1(p)!=='pending') return false;
    if(tabF==='s2' && getS2(p)!=='pending') return false;
    if(tabF==='s3' && getS3(p)!=='pending') return false;
    if(tabF==='sign' && (ag==='pending'||ag==='C'||sg)) return false;
    if(q){
      const num=String(p.problem_number);
      if(!p.id.toLowerCase().includes(q) &&
         !(p.title||'').toLowerCase().includes(q) &&
         !(p.topic||'').toLowerCase().includes(q) &&
         !num.includes(q)) return false;
    }
    return true;
  });
}

function stLbl(v){ return {pass:'✅통과',fail:'❌실패',fixed:'🔧수정',pending:'⏳대기'}[v]||'⏳'; }

function render(){
  updateStats();
  const list = getFiltered();
  document.getElementById('f-cnt').textContent = list.length+'개 표시 / 전체 '+RAW.length+'개';
  const grid = document.getElementById('grid');
  if(!list.length){ grid.innerHTML='<div class="no-r">검색 결과 없음</div>'; return; }

  grid.innerHTML = list.map(p => {
    const s1=getS1(p),s2=getS2(p),s3=getS3(p);
    const gr=autoGrade(p), sg=isSigned(p);
    const imgN=p.img_encoded||'';
    const imgS=imgN?CB+imgN:'';
    const ans=getAF(p)||p.answer||'없음';
    const tr1=getTrS(p,'1'),tr2=getTrS(p,'2'),tr3=getTrS(p,'3');
    const cp1=getCpS(p,'1'),cp2=getCpS(p,'2'),cp3=getCpS(p,'3');
    const trf=getTrF(p),cpf=getCpF(p);

    return `<div class="card" id="c_${p.id}" data-g="${gr}" data-signed="${sg?1:0}">

  <span class="tag tag-mon">${p.month}</span>
  <span class="tag tag-subj">${p.subject}</span>
  <span class="gbadge ${gr}">${gr==='A'?'✅A':gr==='B'?'🟠B':gr==='C'?'❌C':'⏳'}</span>
  <span class="sbadge ${trf?'ok':'tr'}">${trf?'tr✓':'tr-'}</span>
  <span class="sbadge ${cpf?'ok':'cp'}">${cpf?'cp✓':'cp-'}</span>
</div>
<div class="cbody">
  <div class="cimg-w" onclick="oLb('${imgS}','${p.id}')">
    ${imgS?`<img class="cimg" src="${imgS}" onerror="this.parentNode.innerHTML='<div style=padding:16px;color:#ccc;font-size:.75rem>이미지없음<br>${p.id}</div>'">`:'<div style="padding:16px;color:#ccc;font-size:.75rem">이미지없음</div>'}
    <div style="position:absolute;bottom:3px;right:4px;background:rgba(0,0,0,.4);color:#fff;font-size:.6rem;padding:1px 4px;border-radius:3px">🔍</div>
  </div>
  <div class="cinfo">
    <div class="ci"><span class="cl">정답</span><span class="cans">${ans}</span></div>
    <div class="ci"><span class="cl">난이도</span><span class="cv">${p.difficulty||'-'}</span></div>
    <div class="ci"><span class="cl">단원</span><span class="cv">${p.topic||'-'}</span></div>
    <div class="ci"><span class="cl">영역</span><span class="cv">${p.domain||'-'}</span></div>
    <div class="strow">
      <span class="stg ${s1}">1:${stLbl(s1)}</span>
      <span class="stg ${s2}">2:${stLbl(s2)}</span>
      <span class="stg ${s3}">3:${stLbl(s3)}</span>
    </div>
  </div>
</div>
<div class="cact">
  <div class="sec">
    <span class="slbl lbl1">1단계 · 이미지</span>
    <div class="brow">
      <button class="btn bpass" onclick="setSt(1,'${p.id}','pass')">✅정상</button>
      <button class="btn bfail" onclick="setSt(1,'${p.id}','fail')">❌오류</button>
      <button class="btn btn-tr ${tr1?'signed':''}" onclick="signStage(RAW.find(x=>x.id==='${p.id}'),'tr','1')">🖊tr${tr1?'✓':'?'}</button>
      <button class="btn btn-cp ${cp1?'signed':''}" onclick="signStage(RAW.find(x=>x.id==='${p.id}'),'cp','1')">🖊cp${cp1?'✓':'?'}</button>
    </div>
    <textarea class="ta" rows="1" placeholder="이미지 메모..." onchange="s('${p.id}','n1',this.value)">${getN(p,'1')}</textarea>
  </div>
  <div class="sec">
    <span class="slbl lbl2">2단계 · 정답</span>
    <div class="brow">
      <button class="btn bpass" onclick="setSt(2,'${p.id}','pass')">✅정확</button>
      <button class="btn bfix" onclick="setSt(2,'${p.id}','fixed');document.getElementById('af${p.id}').focus()">🔧수정</button>
      <button class="btn bfail" onclick="setSt(2,'${p.id}','fail')">❌오류</button>
      <button class="btn btn-tr ${tr2?'signed':''}" onclick="signStage(RAW.find(x=>x.id==='${p.id}'),'tr','2')">🖊tr${tr2?'✓':'?'}</button>
      <button class="btn btn-cp ${cp2?'signed':''}" onclick="signStage(RAW.find(x=>x.id==='${p.id}'),'cp','2')">🖊cp${cp2?'✓':'?'}</button>
    </div>
    <input class="af" id="af${p.id}" placeholder="수정 정답..." value="${getAF(p)}" onchange="s('${p.id}','af',this.value)">
    <textarea class="ta" rows="1" placeholder="정답 메모..." onchange="s('${p.id}','n2',this.value)">${getN(p,'2')}</textarea>
  </div>
  <div class="sec">
    <span class="slbl lbl3">3단계 · 해설</span>
    <div class="brow">
      <button class="btn bpass" onclick="setSt(3,'${p.id}','pass')">✅완료</button>
      <button class="btn bfail" onclick="setSt(3,'${p.id}','fail')">❌필요</button>
      <button class="btn btn-tr ${tr3?'signed':''}" onclick="signStage(RAW.find(x=>x.id==='${p.id}'),'tr','3')">🖊tr${tr3?'✓':'?'}</button>
      <button class="btn btn-cp ${cp3?'signed':''}" onclick="signStage(RAW.find(x=>x.id==='${p.id}'),'cp','3')">🖊cp${cp3?'✓':'?'}</button>
    </div>
    <textarea class="ta" rows="2" placeholder="해설 입력..." onchange="s('${p.id}','sol',this.value)">${getSol(p)}</textarea>
  </div>
  <div class="sign-final">
    <span class="slbl lbls" style="margin-bottom:4px;display:block">🏆 최종 서명</span>
    <div class="brow">
      <button class="btn btn-tr ${trf?'signed':''}" style="flex:1" onclick="signFinal(RAW.find(x=>x.id==='${p.id}'),'tr')">
        🖊 선생님(tr) ${trf?'✓ '+trf:'서명하기'}
      </button>
      <button class="btn btn-cp ${cpf?'signed':''}" style="flex:1" onclick="signFinal(RAW.find(x=>x.id==='${p.id}'),'cp')">
        🖊 관리자(cp) ${cpf?'✓ '+cpf:'서명하기'}
      </button>
    </div>
    ${(trf&&cpf)?'<div style="text-align:center;color:#2e7d32;font-weight:700;font-size:.8rem;margin-top:3px">🏆 TR✓ CP✓ 검수 완료</div>':''}
  </div>
</div>
</div>`;
  }).join('');
}

function setSt(stage,id,val){ s(id,'s'+stage,val); render(); }
function applyFilters(){ render(); }
function resetFilters(){
  ['f-year','f-src','f-mon','f-subj','f-grade'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('f-search').value='';
  render();
}

function updateStats(){
  const n=RAW.length;
  const s1p=RAW.filter(p=>getS1(p)==='pass').length;
  const s2p=RAW.filter(p=>getS2(p)==='pass'||getS2(p)==='fixed').length;
  const s3p=RAW.filter(p=>getS3(p)==='pass').length;
  const A=RAW.filter(p=>autoGrade(p)==='A').length;
  const B=RAW.filter(p=>autoGrade(p)==='B').length;
  const C=RAW.filter(p=>autoGrade(p)==='C').length;
  const pnd=RAW.filter(p=>autoGrade(p)==='pending').length;
  const trD=RAW.filter(p=>getTrF(p)!=='').length;
  const cpD=RAW.filter(p=>getCpF(p)!=='').length;
  const sg=RAW.filter(p=>isSigned(p)).length;
  const pct=x=>Math.round(x/n*100);
  const upd=(b,v)=>{
    document.getElementById(b).style.width=pct(v)+'%';
    document.getElementById('t'+b.slice(1)).textContent=v+'/'+n+'('+pct(v)+'%)';
  };
  upd('p1',s1p);upd('p2',s2p);upd('p3',s3p);
  document.getElementById('ptr').style.width=pct(trD)+'%';
  document.getElementById('ttr').textContent='tr:'+trD+'/'+n;
  document.getElementById('pcp').style.width=pct(cpD)+'%';
  document.getElementById('tcp').textContent='cp:'+cpD+'/'+n;
  document.getElementById('pa').style.width=pct(sg)+'%';
  document.getElementById('ta').textContent=sg+'/'+n+'('+pct(sg)+'%)';
  document.getElementById('hs-t').textContent='전체 '+n;
  document.getElementById('hs-a').textContent='✅A '+A;
  document.getElementById('hs-s').textContent='🖊서명 '+sg;
  document.getElementById('hs-b').textContent='🟠B '+B;
  document.getElementById('hs-c').textContent='❌C '+C;
  document.getElementById('hs-p').textContent='⏳미완 '+pnd;
}

function setTab(t,el){
  tabF=t;
  document.querySelectorAll('.stab').forEach(x=>x.classList.remove('on'));
  el.classList.add('on');
  render();
}
function oLb(src,cap){
  if(!src)return;
  document.getElementById('lb-img').src=src;
  document.getElementById('lb').classList.add('show');
}
function cLb(){ document.getElementById('lb').classList.remove('show'); }

function saveAll(){
  const all=RAW.map(p=>(({
    id:p.id,num:p.problem_number,year:p.year,source:p.source_type,subject:p.subject,
    s1:getS1(p),n1:getN(p,'1'),tr1:getTrS(p,'1'),cp1:getCpS(p,'1'),
    s2:getS2(p),n2:getN(p,'2'),af:getAF(p),tr2:getTrS(p,'2'),cp2:getCpS(p,'2'),
    s3:getS3(p),n3:getN(p,'3'),sol:getSol(p),tr3:getTrS(p,'3'),cp3:getCpS(p,'3'),
    trf:getTrF(p),cpf:getCpF(p),final:autoGrade(p),signed:isSigned(p)
  })));
  const b=new Blob([JSON.stringify(all,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);
  a.download='verify_signed_'+new Date().toISOString().slice(0,10)+'.json';a.click();
  alert('저장 완료!\n→ python3 scripts/import_verify.py 파일명.json 으로 DB 반영');
}

function exportRpt(){
  const A=RAW.filter(p=>autoGrade(p)==='A'&&isSigned(p));
  const C=RAW.filter(p=>autoGrade(p)==='C');
  const pnd=RAW.filter(p=>autoGrade(p)==='pending');
  let md=`# 검수 리포트 ${new Date().toLocaleString()}\n\n`;
  md+=`## ✅ 완료+서명: ${A.length}개\n`;
  A.forEach(p=>md+=`- ${p.id} | ${p.year}${p.source_type} ${p.subject} ${p.problem_number}번\n`);
  md+=`\n## ❌ C등급: ${C.length}개\n`;
  C.forEach(p=>md+=`- ${p.id}: img=${getS1(p)}, ans=${getS2(p)}, sol=${getS3(p)} | ${getN(p,'1')||getN(p,'2')||''}\n`);
  md+=`\n## ⏳ 미검수: ${pnd.length}개\n`;
  pnd.forEach(p=>md+=`- ${p.id}\n`);
  const b=new Blob([md],{type:'text/markdown'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);
  a.download='verify_report.md';a.click();
}

render();
</script>
