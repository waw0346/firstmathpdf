<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📚 수학 문제 위키 대시보드</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d2e;
    --surface2: #242840;
    --border: #2e3150;
    --primary: #6c63ff;
    --primary-light: #8b83ff;
    --accent: #ff6584;
    --text: #e8eaf6;
    --text-dim: #8892b0;
    --green: #43d9ad;
    --yellow: #ffd56b;
    --red: #ff6584;
    --dark: #9f9f9f;
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Pretendard', 'Noto Sans KR', sans-serif; min-height: 100vh; }

  /* HEADER */
  header { background: linear-gradient(135deg, var(--surface), #1e1a4f); padding: 20px 32px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 16px; }
  header h1 { font-size: 1.5rem; font-weight: 700; }
  header .subtitle { color: var(--text-dim); font-size: 0.85rem; }
  .badge { background: var(--primary); color: white; font-size: 0.7rem; padding: 2px 8px; border-radius: 20px; font-weight: 600; }

  /* LAYOUT */
  .container { display: grid; grid-template-columns: 260px 1fr; min-height: calc(100vh - 70px); }

  /* SIDEBAR */
  aside { background: var(--surface); border-right: 1px solid var(--border); padding: 20px 16px; overflow-y: auto; }
  aside h3 { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-dim); margin-bottom: 8px; margin-top: 20px; }
  aside h3:first-child { margin-top: 0; }

  .filter-group { display: flex; flex-direction: column; gap: 4px; }
  .filter-btn {
    background: transparent; border: 1px solid var(--border); border-radius: 8px;
    color: var(--text-dim); cursor: pointer; font-size: 0.82rem; padding: 7px 12px;
    text-align: left; transition: all 0.15s; display: flex; justify-content: space-between;
  }
  .filter-btn:hover, .filter-btn.active {
    background: var(--primary); border-color: var(--primary); color: white;
  }
  .filter-btn .cnt { opacity: 0.7; font-size: 0.75rem; }

  .diff-btn-하    { border-color: #43d9ad33; }
  .diff-btn-하.active    { background: #43d9ad; border-color: #43d9ad; color: #000; }
  .diff-btn-중   { border-color: #ffd56b33; }
  .diff-btn-중.active   { background: #ffd56b; border-color: #ffd56b; color: #000; }
  .diff-btn-상    { border-color: #ff658433; }
  .diff-btn-상.active    { background: #ff6584; border-color: #ff6584; }
  .diff-btn-최상 { border-color: #9f9f9f33; }
  .diff-btn-최상.active { background: #9f9f9f; border-color: #9f9f9f; color: #000; }

  /* MAIN */
  main { padding: 24px; overflow-y: auto; }

  /* SEARCH BAR */
  .search-bar { display: flex; gap: 8px; margin-bottom: 20px; }
  .search-input {
    flex: 1; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); color: var(--text); font-size: 0.95rem;
    padding: 10px 16px; outline: none; transition: border-color 0.2s;
  }
  .search-input:focus { border-color: var(--primary); }
  .search-input::placeholder { color: var(--text-dim); }
  .btn {
    background: var(--primary); border: none; border-radius: var(--radius);
    color: white; cursor: pointer; font-size: 0.9rem; font-weight: 600;
    padding: 10px 20px; transition: background 0.2s;
  }
  .btn:hover { background: var(--primary-light); }
  .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text-dim); }
  .btn-outline:hover { border-color: var(--primary); color: var(--primary); background: transparent; }

  /* STATS CARDS */
  .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px; }
  .stat-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px; text-align: center;
  }
  .stat-card .num { font-size: 2rem; font-weight: 700; color: var(--primary-light); }
  .stat-card .label { font-size: 0.78rem; color: var(--text-dim); margin-top: 4px; }

  /* RESULTS */
  .results-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .results-header h2 { font-size: 1rem; }
  .results-count { color: var(--text-dim); font-size: 0.85rem; }

  .problem-grid { display: flex; flex-direction: column; gap: 8px; }
  .problem-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 18px; cursor: pointer; transition: all 0.2s;
    display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: start;
  }
  .problem-card:hover { border-color: var(--primary); background: var(--surface2); }

  .problem-title { font-weight: 600; font-size: 0.95rem; margin-bottom: 4px; }
  .problem-meta { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag {
    background: var(--surface2); border-radius: 6px; color: var(--text-dim);
    font-size: 0.73rem; padding: 2px 8px;
  }
  .tag.domain { color: var(--primary-light); background: #6c63ff22; }
  .tag.grade  { color: var(--green); background: #43d9ad22; }
  .tag.school { color: var(--yellow); background: #ffd56b22; }

  .diff-badge {
    border-radius: 8px; font-size: 0.75rem; font-weight: 700;
    padding: 3px 10px; white-space: nowrap;
  }
  .diff-하    { background: #43d9ad33; color: #43d9ad; }
  .diff-중   { background: #ffd56b33; color: #ffd56b; }
  .diff-상    { background: #ff658433; color: #ff6584; }
  .diff-최상 { background: #9f9f9f33; color: #c8c8c8; }

  /* MODAL */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 1000;
    display: none; align-items: center; justify-content: center; padding: 24px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    max-width: 800px; width: 100%; max-height: 85vh; overflow-y: auto; padding: 28px;
  }
  .modal-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
  .modal-title { font-size: 1.2rem; font-weight: 700; }
  .close-btn { background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 1.2rem; }
  .modal-body { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .problem-text {
    background: var(--bg); border-radius: var(--radius); padding: 16px;
    font-family: monospace; font-size: 0.85rem; white-space: pre-wrap;
    border: 1px solid var(--border); grid-column: 1 / -1;
  }
  .meta-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  .meta-table td { padding: 6px 10px; border-bottom: 1px solid var(--border); }
  .meta-table td:first-child { color: var(--text-dim); width: 35%; }
  .answer-box {
    background: #43d9ad22; border: 1px solid #43d9ad55; border-radius: var(--radius);
    padding: 12px 16px; font-size: 1.1rem; font-weight: 700; color: var(--green);
  }
  .similar-list { list-style: none; }
  .similar-list li {
    padding: 8px 12px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--border); margin-bottom: 6px; font-size: 0.85rem;
    transition: all 0.15s;
  }
  .similar-list li:hover { background: var(--surface2); border-color: var(--primary); }

  /* NO DATA */
  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-dim); }
  .empty-state .icon { font-size: 3rem; margin-bottom: 16px; }
  .empty-state h3 { font-size: 1.1rem; margin-bottom: 8px; }

  /* LOADING */
  .loading { text-align: center; padding: 40px; color: var(--text-dim); }

  @media (max-width: 768px) {
    .container { grid-template-columns: 1fr; }
    aside { display: none; }
    .stats-grid { grid-template-columns: repeat(2, 1fr); }
    .modal-body { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>📚 수학 문제 위키</h1>
    <div class="subtitle">10년 수학문제 통합 검색 · 유사문제 · 영역별 탐색</div>
  </div>
  <span class="badge" id="total-badge">로딩 중...</span>
</header>

<div class="container">
  <!-- SIDEBAR -->
  <aside>
    <h3>🎓 학년</h3>
    <div class="filter-group" id="grade-filters"></div>

    <h3>📐 영역</h3>
    <div class="filter-group" id="domain-filters"></div>

    <h3>🎯 난이도</h3>
    <div class="filter-group" id="diff-filters">
      <button class="filter-btn diff-btn-하"   onclick="toggleFilter('difficulty','하')">🟢 하 <span class="cnt" id="cnt-하"></span></button>
      <button class="filter-btn diff-btn-중"  onclick="toggleFilter('difficulty','중')">🟡 중 <span class="cnt" id="cnt-중"></span></button>
      <button class="filter-btn diff-btn-상"   onclick="toggleFilter('difficulty','상')">🔴 상 <span class="cnt" id="cnt-상"></span></button>
      <button class="filter-btn diff-btn-최상" onclick="toggleFilter('difficulty','최상')">⚫ 최상 <span class="cnt" id="cnt-최상"></span></button>
    </div>

    <h3>📅 연도</h3>
    <div class="filter-group" id="year-filters"></div>

    <h3>🏫 학교</h3>
    <div class="filter-group" id="school-filters"></div>

    <div style="margin-top: 20px;">
      <button class="btn btn-outline" style="width:100%;font-size:0.82rem;" onclick="clearAllFilters()">🗑 필터 초기화</button>
    </div>
  </aside>

  <!-- MAIN -->
  <main>
    <!-- SEARCH -->
    <div class="search-bar">
      <input class="search-input" id="search-input" placeholder="🔍 문제 키워드, 단원, 개념 검색..." oninput="debounceSearch()" />
      <button class="btn" onclick="doSearch()">검색</button>
      <button class="btn btn-outline" onclick="showStats()">📊 통계</button>
    </div>

    <!-- STATS -->
    <div class="stats-grid" id="stats-grid">
      <div class="stat-card"><div class="num" id="stat-total">-</div><div class="label">총 문제</div></div>
      <div class="stat-card"><div class="num" id="stat-schools">-</div><div class="label">학교/기관</div></div>
      <div class="stat-card"><div class="num" id="stat-years">-</div><div class="label">수록 연도</div></div>
      <div class="stat-card"><div class="num" id="stat-topics">-</div><div class="label">단원</div></div>
    </div>

    <!-- RESULTS -->
    <div class="results-header">
      <h2 id="results-title">전체 문제</h2>
      <span class="results-count" id="results-count"></span>
    </div>
    <div class="problem-grid" id="problem-grid">
      <div class="loading">⏳ 데이터를 불러오는 중...<br><small style="margin-top:8px;display:block">problems.db가 있어야 합니다. ingest.py를 먼저 실행하세요.</small></div>
    </div>
  </main>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal" onclick="closeModal(event)">
  <div class="modal" id="modal-content">
    <div class="modal-header">
      <div>
        <div class="modal-title" id="modal-title"></div>
        <div id="modal-id" style="color:var(--text-dim);font-size:0.8rem;margin-top:4px;"></div>
      </div>
      <button class="close-btn" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script>
// ─────────────────────────────────────
// 데이터 레이어 (sql.js로 SQLite 직접 읽기)
// 또는 JSON export 방식 fallback
// ─────────────────────────────────────

let DB_DATA = [];       // 전체 문제 목록
let FILTERED = [];      // 현재 필터 결과
let ACTIVE_FILTERS = {};// 활성 필터

// JSON 파일 로드 시도 (wiki_builder가 생성하는 export)
async function loadData() {
  try {
    const resp = await fetch('../db/problems_export.json');
    if (resp.ok) {
      DB_DATA = await resp.json();
      initDashboard();
    } else {
      showNoDataState();
    }
  } catch(e) {
    // sql.js 시도
    try {
      await loadSqlJs();
    } catch(e2) {
      showNoDataState();
    }
  }
}

function showNoDataState() {
  document.getElementById('problem-grid').innerHTML = `
    <div class="empty-state">
      <div class="icon">📭</div>
      <h3>아직 문제가 없습니다</h3>
      <p>먼저 PDF를 인제스트하세요:</p>
      <pre style="background:var(--bg);padding:12px;border-radius:8px;margin-top:12px;font-size:0.8rem;text-align:left">
python scripts/ingest.py --pdf sources/2023/분당중.pdf
python scripts/embed.py --build
python scripts/export_json.py   # 대시보드용 JSON 내보내기
      </pre>
    </div>`;
  document.getElementById('total-badge').textContent = '0문제';
}

function initDashboard() {
  FILTERED = [...DB_DATA];
  buildSidebarFilters();
  renderStats();
  renderProblems(FILTERED.slice(0, 50));
  document.getElementById('total-badge').textContent = `${DB_DATA.length.toLocaleString()}문제`;
}

// ─────────────────────────────────────
// 필터 사이드바 빌드
// ─────────────────────────────────────
function buildSidebarFilters() {
  buildFilterGroup('grade-filters', 'grade', getUnique('grade'));
  buildFilterGroup('domain-filters', 'domain', getUnique('domain'));
  buildFilterGroup('year-filters', 'year', getUnique('year').sort((a,b)=>b-a));
  buildFilterGroup('school-filters', 'school', getUnique('school').slice(0,10));

  // 난이도 카운트
  ['하','중','상','최상'].forEach(d => {
    const el = document.getElementById(`cnt-${d}`);
    if (el) el.textContent = DB_DATA.filter(p=>p.difficulty===d).length;
  });
}

function getUnique(field) {
  return [...new Set(DB_DATA.map(p=>p[field]).filter(Boolean))].sort();
}

function buildFilterGroup(containerId, field, values) {
  const el = document.getElementById(containerId);
  if (!el) return;
  el.innerHTML = values.map(v => {
    const cnt = DB_DATA.filter(p=>p[field]==v).length;
    return `<button class="filter-btn" id="fb-${field}-${v}"
      onclick="toggleFilter('${field}','${v}')">${v} <span class="cnt">${cnt}</span></button>`;
  }).join('');
}

function toggleFilter(field, value) {
  if (ACTIVE_FILTERS[field] === value) {
    delete ACTIVE_FILTERS[field];
    document.querySelectorAll(`[id^="fb-${field}-"]`).forEach(b => b.classList.remove('active'));
    document.querySelectorAll(`.diff-btn-${value}`).forEach(b => b.classList.remove('active'));
  } else {
    ACTIVE_FILTERS[field] = value;
    document.querySelectorAll(`[id^="fb-${field}-"]`).forEach(b => b.classList.remove('active'));
    const btn = document.getElementById(`fb-${field}-${value}`);
    if (btn) btn.classList.add('active');
    document.querySelectorAll(`.diff-btn-${value}`).forEach(b => b.classList.add('active'));
  }
  applyFilters();
}

function clearAllFilters() {
  ACTIVE_FILTERS = {};
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('search-input').value = '';
  applyFilters();
}

// ─────────────────────────────────────
// 검색 & 필터 적용
// ─────────────────────────────────────
let searchTimer;
function debounceSearch() {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(doSearch, 300);
}

function doSearch() {
  applyFilters();
}

function applyFilters() {
  const q = document.getElementById('search-input').value.toLowerCase().trim();

  FILTERED = DB_DATA.filter(p => {
    // 필터 조건
    for (const [field, val] of Object.entries(ACTIVE_FILTERS)) {
      if (String(p[field]) !== String(val)) return false;
    }
    // 검색어
    if (q) {
      const searchable = [p.title, p.topic, p.domain, p.school, p.raw_text, p.grade]
        .join(' ').toLowerCase();
      if (!searchable.includes(q)) return false;
    }
    return true;
  });

  const filters = Object.entries(ACTIVE_FILTERS).map(([k,v])=>`${k}:${v}`).join(' ');
  const title = q ? `"${q}" 검색` : (filters || '전체 문제');
  document.getElementById('results-title').textContent = title;
  renderProblems(FILTERED.slice(0, 100));
}

// ─────────────────────────────────────
// 렌더링
// ─────────────────────────────────────
function renderStats() {
  document.getElementById('stat-total').textContent = DB_DATA.length.toLocaleString();
  document.getElementById('stat-schools').textContent = getUnique('school').length;
  document.getElementById('stat-years').textContent = getUnique('year').length;
  document.getElementById('stat-topics').textContent = getUnique('topic').length;
}

function renderProblems(problems) {
  const grid = document.getElementById('problem-grid');
  const count = document.getElementById('results-count');
  count.textContent = `${FILTERED.length.toLocaleString()}개 (${problems.length} 표시)`;

  if (!problems.length) {
    grid.innerHTML = `<div class="empty-state"><div class="icon">🔍</div><h3>검색 결과가 없습니다</h3></div>`;
    return;
  }

  grid.innerHTML = problems.map(p => `
    <div class="problem-card" onclick="showDetail('${p.id}')">
      <div>
        <div class="problem-title">${escHtml(p.title || p.id)}</div>
        <div class="problem-meta">
          <span class="tag grade">${p.grade || ''}</span>
          <span class="tag domain">${p.domain || ''}</span>
          <span class="tag">${p.topic || ''}</span>
          <span class="tag school">🏫 ${p.school || ''} ${p.year || ''}</span>
          <span class="tag">${p.exam_type || ''}</span>
        </div>
      </div>
      <div>
        <div class="diff-badge diff-${p.difficulty}">${diffIcon(p.difficulty)} ${p.difficulty}</div>
      </div>
    </div>
  `).join('');
}

function diffIcon(d) {
  return {하:'🟢', 중:'🟡', 상:'🔴', 최상:'⚫'}[d] || '';
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ─────────────────────────────────────
// 상세 모달
// ─────────────────────────────────────
function showDetail(id) {
  const p = DB_DATA.find(x => x.id === id);
  if (!p) return;

  document.getElementById('modal-title').textContent = p.title || id;
  document.getElementById('modal-id').textContent = `ID: ${id}`;

  const concepts = Array.isArray(p.concept) ? p.concept.join(', ') : (p.concept || '');
  const similar = (p.similar_ids || []).slice(0, 5);

  document.getElementById('modal-body').innerHTML = `
    <div class="problem-text">${escHtml(p.raw_text || '(문제 텍스트 없음)')}</div>
    <div>
      <div class="answer-box" style="margin-bottom:16px">✅ 정답: ${escHtml(p.answer || '?')}</div>
      <table class="meta-table">
        <tr><td>학년</td><td>${p.grade || ''}</td></tr>
        <tr><td>영역</td><td>${p.domain || ''}</td></tr>
        <tr><td>단원</td><td>${p.topic || ''}</td></tr>
        <tr><td>개념</td><td>${concepts}</td></tr>
        <tr><td>난이도</td><td>${diffIcon(p.difficulty)} ${p.difficulty || ''}</td></tr>
        <tr><td>출처</td><td>${p.school || ''} ${p.year || ''}</td></tr>
        <tr><td>시험</td><td>${p.exam_type || ''}</td></tr>
      </table>
    </div>
    <div>
      <div style="font-size:0.85rem;color:var(--text-dim);margin-bottom:8px;">🔗 유사 문제</div>
      ${similar.length ? `<ul class="similar-list">${similar.map(sid => {
        const sp = DB_DATA.find(x=>x.id===sid);
        return sp ? `<li onclick="showDetail('${sid}')">${sp.title || sid} <small style="color:var(--text-dim)">(${sp.difficulty}/${sp.topic})</small></li>` : '';
      }).join('')}</ul>` : '<div style="color:var(--text-dim);font-size:0.82rem">유사문제 계산 전입니다.<br>embed.py --build 를 실행하세요.</div>'}
    </div>
  `;

  document.getElementById('modal').classList.add('open');
}

function closeModal(e) {
  if (!e || e.target === document.getElementById('modal') || e.currentTarget.classList.contains('close-btn')) {
    document.getElementById('modal').classList.remove('open');
  }
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// ─────────────────────────────────────
// 통계 모달
// ─────────────────────────────────────
function showStats() {
  const domains = {};
  const diffs = {하:0, 중:0, 상:0, 최상:0};
  DB_DATA.forEach(p => {
    domains[p.domain] = (domains[p.domain]||0)+1;
    if (diffs[p.difficulty]!==undefined) diffs[p.difficulty]++;
  });

  const domainBars = Object.entries(domains).sort((a,b)=>b[1]-a[1]).map(([d,c]) => {
    const pct = (c/DB_DATA.length*100).toFixed(1);
    return `<div style="margin-bottom:8px">
      <div style="display:flex;justify-content:space-between;font-size:0.85rem;margin-bottom:3px">
        <span>${d}</span><span style="color:var(--text-dim)">${c}개 (${pct}%)</span>
      </div>
      <div style="background:var(--border);border-radius:4px;height:8px">
        <div style="background:var(--primary);border-radius:4px;height:8px;width:${pct}%"></div>
      </div>
    </div>`;
  }).join('');

  document.getElementById('modal-title').textContent = '📊 문제 통계';
  document.getElementById('modal-id').textContent = '';
  document.getElementById('modal-body').innerHTML = `
    <div>
      <div style="font-size:0.85rem;color:var(--text-dim);margin-bottom:12px;">영역별 분포</div>
      ${domainBars}
    </div>
    <div>
      <div style="font-size:0.85rem;color:var(--text-dim);margin-bottom:12px;">난이도 분포</div>
      ${Object.entries(diffs).map(([d,c])=>`
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
          <span style="width:30px">${diffIcon(d)}</span>
          <span style="width:30px;font-size:0.85rem">${d}</span>
          <div style="flex:1;background:var(--border);border-radius:4px;height:8px">
            <div style="background:var(--primary);border-radius:4px;height:8px;width:${DB_DATA.length?c/DB_DATA.length*100:0}%"></div>
          </div>
          <span style="color:var(--text-dim);font-size:0.82rem">${c}</span>
        </div>
      `).join('')}
    </div>
  `;
  document.getElementById('modal').classList.add('open');
}

// ─────────────────────────────────────
// 초기화
// ─────────────────────────────────────
loadData();
</script>
</body>
</html>
