*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Malgun Gothic',sans-serif;background:#1a1a2e;color:#eee}
.hd{background:#0f3460;padding:12px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:100}
.hd h1{font-size:1rem;color:#e94560}

.stat{background:rgba(255,255,255,.1);padding:3px 10px;border-radius:12px;font-size:.75rem}
.filters{background:#16213e;padding:8px 20px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-bottom:1px solid #333}
.fs{padding:4px 8px;border-radius:6px;border:1px solid #444;background:#1a1a2e;color:#ccc;font-size:.78rem;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;padding:12px 20px}
.card{background:#16213e;border-radius:8px;overflow:hidden;border:2px solid #333;transition:.15s;cursor:pointer}
.card:hover{border-color:#e94560;transform:translateY(-2px)}
.card.pass{border-color:#00b894}
.card.fail{border-color:#d63031}
.card.B{border-color:#fdcb6e}
.card.A{border-color:#00b894;box-shadow:0 0 8px #00b894}
.ch{padding:5px 8px;display:flex;align-items:center;gap:4px;font-size:.72rem;flex-wrap:wrap}
.cnum{font-weight:700;font-size:.85rem;color:#e94560;min-width:28px}
.tag{padding:1px 5px;border-radius:8px;font-size:.65rem;font-weight:700}
.ty{background:#0f3460;color:#74b9ff}
.ts{background:#2d3436;color:#b2bec3}
.tg{background:#2d3436;color:#dfe6e9}
.ans{margin-left:auto;font-weight:700;color:#fdcb6e;font-size:.82rem}
.img-box{width:100%;background:#0d1117;display:flex;align-items:center;justify-content:center;min-height:80px;max-height:200px;overflow:hidden}
.img-box img{width:100%;max-height:200px;object-fit:contain}
.no-img{color:#555;font-size:.72rem;padding:20px;text-align:center}
.cf{padding:5px 8px;display:flex;gap:4px}
.btn{flex:1;padding:4px 0;border-radius:5px;border:none;cursor:pointer;font-size:.72rem;font-weight:700;transition:.1s}
.btn:hover{filter:brightness(1.2)}
.bp{background:#00b894;color:#fff}
.bf{background:#d63031;color:#fff}
.bh{background:#0f3460;color:#74b9ff}
.grade-a{background:#00b894;color:#fff;text-align:center;font-size:.7rem;padding:2px}
.grade-b{background:#fdcb6e;color:#2d3436;text-align:center;font-size:.7rem;padding:2px}
.no-result{color:#555;text-align:center;padding:60px;grid-column:1/-1;font-size:1rem}
#toast{position:fixed;bottom:20px;right:20px;background:#00b894;color:#fff;padding:10px 18px;border-radius:8px;font-size:.85rem;display:none;z-index:999}
</style>

let LS = {};
try{LS=JSON.parse(localStorage.getItem('qv2')||'{}');}catch(e){}
const save = ()=>localStorage.setItem('qv2',JSON.stringify(LS));
const gS1 = p=>LS[p.id]?.s1||p.stage1_img||'pending';
const gS2 = p=>LS[p.id]?.s2||p.stage2_ans||'pending';
const gS3 = p=>LS[p.id]?.s3||p.stage3_sol||'pending';
const gFail= p=>LS[p.id]?.fail||false;
const autoGrade=p=>{
  if(gFail(p)) return 'fail';
  if(gS1(p)==='pass'&&gS2(p)==='pass'&&gS3(p)==='pass') return 'A';
  if(gS1(p)==='pass'&&gS2(p)==='pass') return 'B';
  return 'pending';
};

function getList(){
  const yr=document.getElementById('f-yr').value;
  const src=document.getElementById('f-src').value;
  const subj=document.getElementById('f-subj').value;
  const grade=document.getElementById('f-grade').value;
  const q=document.getElementById('f-q').value.toLowerCase();
  return DATA.filter(p=>{
    if(yr&&String(p.year)!==yr)return false;
    if(src&&p.source_type!==src)return false;
    if(subj&&p.subj!==subj)return false;
    const g=autoGrade(p);
    if(grade==='B'&&g!=='B'&&g!=='pending')return false;
    if(grade==='A'&&g!=='A')return false;
    if(grade==='fail'&&!gFail(p))return false;
    if(q&&!p.id.toLowerCase().includes(q)&&!String(p.problem_number).includes(q))return false;
    return true;
  });
}

function render(){
  updateStats();
  const list=getList();
  document.getElementById('f-cnt').textContent=list.length+'개 표시';
  const grid=document.getElementById('grid');
  if(!list.length){grid.innerHTML='<div class="no-result">없음</div>';return;}
  grid.innerHTML=list.map(p=>{
    const g=autoGrade(p);
    const fail=gFail(p);
    const s3=gS3(p);
    return `<div class="card ${g}" id="cd_${p.id}">
  ${g==='A'?'<div class="grade-a">🏆 A등급 완료</div>':g==='B'?'<div class="grade-b">🟡 B등급 (해설 필요)</div>':fail?'<div style="background:#d63031;color:#fff;text-align:center;font-size:.7rem;padding:2px">❌ 실패 표시</div>':''}
  <div class="ch">
    <span class="cnum">${p.problem_number}번</span>
    <span class="tag ty">${p.year}</span>
    <span class="tag ts">${p.source_type||''}</span>
    <span class="tag tg">${p.subj}</span>
    <span class="ans">${p.answer||'?'}</span>
  </div>
  <div class="img-box">
    ${p.thumb?`<img src="${p.thumb}" loading="lazy">`:'<div class="no-img">이미지없음</div>'}
  </div>
  <div class="cf">
    <button class="btn bp" onclick="markOk('${p.id}')">✅ 정상</button>
    <button class="btn bf" onclick="markFail('${p.id}')">❌ 오류</button>
    <button class="btn bh" onclick="markSol('${p.id}')" title="해설완료">📝 해설</button>
  </div>
</div>`;
  }).join('');
}

function markOk(id){
  if(!LS[id])LS[id]={};
  LS[id].s1='pass';LS[id].s2='pass';LS[id].fail=false;
  save();
  const el=document.getElementById('cd_'+id);
  if(el){el.style.borderColor='#00b894';el.style.opacity='0.7';}
  showToast('✅ '+id+' 정상 처리');
  setTimeout(render,300);
}
function markFail(id){
  if(!LS[id])LS[id]={};
  LS[id].fail=true;
  save();
  showToast('❌ '+id+' 오류 표시');
  render();
}
function markSol(id){
  const sol=prompt(id+' — 해설 입력 (간단히):');
  if(sol===null)return;
  if(!LS[id])LS[id]={};
  LS[id].s3='pass';LS[id].sol=sol;
  save();
  showToast('📝 해설 저장');
  render();
}
function allPass(){
  if(!confirm('현재 필터된 문제를 모두 1+2단계 통과 처리합니까?'))return;
  getList().forEach(p=>{
    if(!LS[p.id])LS[p.id]={};
    LS[p.id].s1='pass';LS[p.id].s2='pass';
  });
  save();render();
  showToast('⚡ '+getList().length+'개 처리 완료');
}
function updateStats(){
  const total=DATA.length;
  const A=DATA.filter(p=>autoGrade(p)==='A').length;
  const B=DATA.filter(p=>autoGrade(p)==='B').length;
  const fail=DATA.filter(p=>gFail(p)).length;
  const pct=Math.round((A+B)/total*100);
  document.getElementById('s-total').textContent='전체 '+total;
  document.getElementById('s-a').textContent='A '+A;
  document.getElementById('s-b').textContent='B '+B;
  document.getElementById('s-f').textContent='❌ '+fail;
  document.getElementById('s-pct').textContent='진행 '+pct+'%';
}
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.style.display='block';
  setTimeout(()=>t.style.display='none',1800);
}
function exportResult(){
  const result=DATA.map(p=>({
    id:p.id,s1:gS1(p),s2:gS2(p),s3:gS3(p),
    fail:gFail(p),sol:LS[p.id]?.sol||'',
    final:autoGrade(p)
  }));
  const b=new Blob([JSON.stringify(result,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);
  a.download='quick_verify_'+new Date().toISOString().slice(0,10)+'.json';a.click();
  alert('저장 완료!\n→ python3 scripts/import_verify.py 파일명.json 으로 DB 반영');
}
render();
</script>
